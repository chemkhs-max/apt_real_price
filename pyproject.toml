[project]
name = "apt-real-price"
version = "0.1.0"
description = "최근 7일 롤링 전국 아파트 매매 실거래가 수집 및 Streamlit 대시보드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "tenacity>=8.5.0",
    "plotly>=5.24.0",
    "pydeck>=0.9.1",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

